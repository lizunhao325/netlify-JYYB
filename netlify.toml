[build]
  command = "npm run build"
  publish = ".next"

# Next.js on Netlify is built with the platform's OpenNext adapter.
# NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY must be
# available in Netlify before the build runs because NEXT_PUBLIC_* values
# are embedded into the browser bundle at build time.
